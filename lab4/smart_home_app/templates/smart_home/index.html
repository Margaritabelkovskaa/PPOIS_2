{% extends 'smart_home/base.html' %}
{% load static %}

{% block content %}
<style>
    body {
        background-image: url("{% static 'smart_home_bg.jpg' %}");
        background-size: cover;
        background-position: center;
        background-attachment: fixed;
    }

    body::before {
        content: '';
        position: fixed;
        top: 0;
        left: 0;
        right: 0;
        bottom: 0;
        background: rgba(0, 0, 0, 0.5);
        z-index: -1;
    }

    .welcome-title {
        text-align: center;
        color: white;
        font-size: 48px;
        margin-top: 50px;
        margin-bottom: 50px;
        text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.5);
    }

    .quick-actions {
        display: flex;
        justify-content: center;
        gap: 30px;
        margin: 50px 0;
        flex-wrap: wrap;
    }

    .quick-btn {
        background: rgba(255, 255, 255, 0.2);
        backdrop-filter: blur(10px);
        border: 2px solid white;
        color: white;
        font-size: 20px;
        padding: 20px 40px;
        border-radius: 15px;
        text-decoration: none;
        transition: all 0.3s ease;
        display: inline-block;
    }

    .quick-btn:hover {
        background: rgba(255, 255, 255, 0.4);
        transform: scale(1.05);
        color: white;
    }

    .stats-container {
        position: fixed;
        bottom: 20px;
        left: 20px;
        right: 20px;
        display: flex;
        justify-content: center;
        gap: 20px;
        flex-wrap: wrap;
        z-index: 10;
    }

    .stat-card {
        background: rgba(0, 0, 0, 0.7);
        backdrop-filter: blur(10px);
        border-radius: 15px;
        padding: 15px 30px;
        text-align: center;
        color: white;
        min-width: 200px;
    }

    .stat-number {
        font-size: 32px;
        font-weight: bold;
        color: #3498db;
    }

    .stat-label {
        font-size: 14px;
        margin-top: 5px;
        opacity: 0.8;
    }

    @media (max-width: 768px) {
        .welcome-title {
            font-size: 32px;
            margin-top: 30px;
        }

        .quick-btn {
            font-size: 16px;
            padding: 12px 24px;
        }

        .stat-card {
            padding: 10px 20px;
            min-width: 150px;
        }

        .stat-number {
            font-size: 24px;
        }
    }
</style>

<h1 class="welcome-title"> Добро пожаловать в Умный дом!</h1>

<div class="quick-actions">
    <a href="{% url 'dashboard' %}" class="quick-btn"> Панель управления</a>
    <a href="{% url 'rooms' %}" class="quick-btn"> Комнаты</a>
    <a href="{% url 'devices' %}" class="quick-btn"> Устройства</a>
    <a href="{% url 'security' %}" class="quick-btn"> Безопасность</a>
</div>

<div class="stats-container">
    <div class="stat-card">
        <div class="stat-number">{{ rooms_count }}</div>
        <div class="stat-label"> Комнат</div>
    </div>
    <div class="stat-card">
        <div class="stat-number">{{ devices_count }}</div>
        <div class="stat-label"> Устройств</div>
    </div>
</div>
{% endblock %}
